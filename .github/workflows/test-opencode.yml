name: Test V8 Summary
on: workflow_dispatch

jobs:
  summarize-v8:
    runs-on: ubuntu-latest
    permissions:
       contents: write
    steps:
      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Setup opencode config
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          mkdir -p "$HOME/.config/opencode"
          ANTHROPIC_MODEL="${ANTHROPIC_MODEL:-MiniMax-M2.1}"
          cat > "$HOME/.config/opencode/opencode.json" <<EOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "model": "anthropic/$ANTHROPIC_MODEL",
            "small_model": "anthropic/$ANTHROPIC_MODEL",
            "autoupdate": false,
            "share": "disabled",
            "provider": {
              "anthropic": {
                "options": {
                  "apiKey": "$ANTHROPIC_API_KEY",
                  "baseURL": "$ANTHROPIC_BASE_URL"
                },
                "models": {
                  "$ANTHROPIC_MODEL": {}
                }
              }
            },
            "permission": {
              "edit": "allow",
              "bash": { "*": "allow" },
              "webfetch": "allow",
              "websearch": "allow"
            },
            "mcp": {
              "Tavily": {
                "type": "local",
                "command": ["npx", "-y", "tavily-mcp"],
                "timeout": 30000,
                "environment": {
                  "TAVILY_API_KEY": "$TAVILY_API_KEY"
                }
              }
            }
          }
          EOF

      - name: Setup jq
        uses: dcarbone/install-jq-action@v2
        with:
          version: '1.7'

      - name: Fetch Recent Commits and Summarize
        run: |
          curl -s "https://api.github.com/repos/v8/v8/commits?since=$(date -d '24 hours ago' -Iseconds)" | jq '.[] | {sha: .sha, author: .commit.author.name, message: .commit.message, date: .commit.committer.date}' > recent_commits.txt
  
      - name: Summarize
        env:
          SUMMARY_PROMPT: ${{ vars.SUMMARY_PROMPT }}
        run: |
          opencode run --auto "$SUMMARY_PROMPT"
      
      - name: Display Summary
        env: 
          SUMMARY_FILE: ${{ vars.SUMMARY_FILE }}
        run: |
            ls
            cat ./$SUMMARY_FILE
