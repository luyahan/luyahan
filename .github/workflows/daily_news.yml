name: Daily News Automation
on:
  schedule:
    - cron: '0 10 * * *' # 每天 UTC 时间 00:00 执行（北京时间 8:00）
  workflow_dispatch: # 允许手动触发测试

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Install uvx
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup opencode config
        env:
          TAVILY_API_KEY: ${{secrets.TAVILY_API_KEY}}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          mkdir -p "$HOME/.config/opencode"
          ANTHROPIC_MODEL="${ANTHROPIC_MODEL:-MiniMax-M2.1}"
          cat > "$HOME/.config/opencode/opencode.json" <<EOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "model": "anthropic/$ANTHROPIC_MODEL",
            "small_model": "anthropic/$ANTHROPIC_MODEL",
            "autoupdate": false,
            "share": "disabled",
            "provider": {
              "anthropic": {
                "options": {
                  "apiKey": "$ANTHROPIC_API_KEY",
                  "baseURL": "$ANTHROPIC_BASE_URL"
                },
                "models": {
                  "$ANTHROPIC_MODEL": {}
                }
              }
            },
            "permission": {
              "edit": "allow",
              "bash": { "*": "allow" },
              "webfetch": "allow",
              "websearch": "allow"
            },
              "Tavily": {
                "type": "local",
                "command": ["npx", "-y", "tavily-mcp"],
                "timeout": 30000,
                "environment": {
                  "TAVILY_API_KEY": "$TAVILY_API_KEY"
                }
              }
            }
          }
          EOF

      - name: Run opencode Summary
        env:
          NEWS_PROMPT: ${{ vars.NEWS_PROMPT }}
        run: |
          opencode run --auto "$NEWS_PROMPT"
      # 安装 Pandoc
      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      # 转换 Markdown 为 HTML
      # --standalone 生成包含 <body> 的完整文档
      # --self-contained 将样式嵌入 HTML
      - name: Convert to HTML
        env: 
          NEWS_FILE: ${{ vars.NEWS_FILE }}
        run: |
          pandoc $NEWS_FILE \
            --standalone \
            --template=default.html4 \
            -o output.html
      

      - name: Send Mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "GitHub每日新闻报告"
          to: yahan@iscas.ac.cn
          from: News Reporter
          html_body: file://output.html
